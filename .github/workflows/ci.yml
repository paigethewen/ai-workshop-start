# CI for your Skill Atlas repository: the typecheck, the tests and the CLI itself, on every pull request
# and every push to main, on a clean machine. A pull request is ready when this is green.
name: CI
on:
  # A branch's pushes run on its pull request: a run for the push too would test the same commit twice.
  push:
    branches: [main]
  pull_request:
  # The Screenshots workflow runs CI again on the baselines it commits: its own push does not.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The real CLI on the fixture repository, as a user would run it: it must exit 0; the web view must answer.
      - name: Smoke test
        run: |
          ./skill-atlas help
          ./skill-atlas scan ./fixture
          ./skill-atlas serve --port 4173 & server=$!
          for i in $(seq 20); do curl -sf http://127.0.0.1:4173/ >/dev/null && break; sleep 0.5; done
          curl -sf 'http://127.0.0.1:4173/api/scan?repo=./fixture' | grep -q '"id":"fixture"'
          kill $server
  # Whether the pull request changes what the live end-to-end tests run: the CLI, the core, those tests,
  # the dependencies or this workflow. Every other event runs them, and so does a diff that cannot be read.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scan: ${{ steps.diff.outputs.scan }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
          elif ! changed=$(git diff --name-only "$BASE...$HEAD"); then
            echo "::warning::Cannot list the pull request's changes: running the live end-to-end tests"
            echo "scan=true" >> "$GITHUB_OUTPUT"
          elif grep -qE '^(src/[^/]+\.ts|src/core/|e2e/github\.test\.ts|package(-lock)?\.json|\.github/workflows/ci\.yml)' <<< "$changed"; then
            echo "scan=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No change to the CLI, the core, the end-to-end tests or the dependencies: the live end-to-end tests are skipped"
            echo "scan=false" >> "$GITHUB_OUTPUT"
          fi
  # The real CLI against real JetBrains repositories on live GitHub, pinned to commits: on main, and on the
  # pull requests that change what it runs, so live GitHub fails no other change.
  e2e:
    needs: scope
    if: needs.scope.outputs.scan == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # The web tests: the demo cases in Chromium, in the image of e2e/web/Dockerfile, with GitHub replayed from
  # e2e/web/github.json. Every run is recorded; a screenshot one pixel off its baseline fails, and its
  # before, after and diff go to the run's summary and to the pull request, for a person to review.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Only a person, through the accept-screenshots label, changes a baseline: never a commit of the branch.
      - name: Baselines from the Screenshots workflow only
        run: |
          authors=$(git log --format='%an' "origin/${{ github.event.repository.default_branch }}..${{ github.event.pull_request.head.sha || github.sha }}" -- e2e/web/screenshots | sort -u | grep -vxF 'github-actions[bot]' || true)
          if [ -n "$authors" ]; then
            echo "::error::e2e/web/screenshots changed in commits by $authors. Baselines change only through the accept-screenshots label: drop those changes."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: echo "${{ github.token }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      # The tests' image, from GHCR; the first run of a new Dockerfile builds and publishes it, but not a fork's.
      - run: npm run e2e
        env:
          SKILL_ATLAS_WEB_PUSH: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '1' || '' }}
      - id: videos
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-videos
          path: test-results/**/*.webm
          retention-days: 30
      - id: report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: web-report
          path: playwright-report/
          retention-days: 30
      - name: Screenshot differences
        if: ${{ !cancelled() && hashFiles('playwright-report/results.json') != '' }}
        run: node e2e/web/report.ts > /dev/null
      - id: diffs
        if: ${{ !cancelled() && hashFiles('screenshot-diffs/**') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: screenshot-diffs/
          retention-days: 30
      - name: Post them
        if: ${{ !cancelled() && hashFiles('playwright-report/results.json') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DIFFS_URL: ${{ steps.diffs.outputs.artifact-url }}
          REPORT_URL: ${{ steps.report.outputs.artifact-url }}
          VIDEOS_URL: ${{ steps.videos.outputs.artifact-url }}
        run: |
          node e2e/web/report.ts > screenshots.md
          cat screenshots.md >> "$GITHUB_STEP_SUMMARY"
          # On the pull request, one comment, kept up to date: posted when a screenshot changes, edited after.
          # A push to main has no pull request to comment on.
          [ "${{ github.event_name }}" != push ] || exit 0
          pr=$(gh pr view "${{ github.head_ref || github.ref_name }}" --json number,state --jq 'select(.state == "OPEN") | .number' 2>/dev/null || true)
          [ -n "$pr" ] || exit 0
          id=$(gh api "repos/${{ github.repository }}/issues/$pr/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- web-screenshots -->"))) | .id' | tail -1)
          if [ -n "$id" ]; then gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$id" -F body=@screenshots.md >/dev/null
          elif [ -d screenshot-diffs ]; then gh pr comment "$pr" --body-file screenshots.md
          fi
